# Docker Compose Override File Example
# 
# Copy this file to docker-compose.override.yml and customize as needed
# docker-compose.override.yml is automatically used when you run docker-compose up
#
# This file is useful for:
# - Custom port mappings
# - Custom environment variables
# - Development-specific settings
# - Personal configurations without modifying the main docker-compose.yml

version: '3.8'

services:
  # Customize the application
  app:
    # Change port mapping (e.g., if 3000 is already in use)
    # ports:
    #   - "8080:3000"
    
    # Override environment variables
    # environment:
    #   - SESSION_SECRET=my-super-secret-key
    #   - ADMIN_USERNAME=myadmin
    #   - ADMIN_PASSWORD=MySecurePassword123!
    
    # Mount additional volumes
    # volumes:
    #   - ./custom-data:/app/data

  # Customize SQL Server
  # sqlserver:
    # Change SQL Server password
    # environment:
    #   - MSSQL_SA_PASSWORD=MyNewStrongPassword123!
    
    # Change port mapping
    # ports:
    #   - "1444:1433"
    
    # Add custom backup directory
    # volumes:
    #   - sqlserver-data:/var/opt/mssql
    #   - ./backups:/var/opt/mssql/backup

